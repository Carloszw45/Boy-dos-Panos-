<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boy Dos Panos</title><style>html,body{margin:0;background:#121215;color:#fff;font-family:Arial,sans-serif}#status{min-height:100vh;display:grid;place-items:center}</style></head><body><div id="status">Carregando Boy Dos Panos…</div><script>(async()=>{try{const b64=(await fetch('./site/site.html.gz.b64')).text().then(s=>s.trim());const raw=atob(await b64);const bytes=Uint8Array.from(raw,c=>c.charCodeAt(0));const stream=new Blob([bytes]).stream().pipeThrough(new DecompressionStream('gzip'));const html=await new Response(stream).text();document.open();document.write(html);document.close()}catch(e){document.getElementById('status').textContent='Não foi possível carregar o site.';console.error(e)}})();</script></body></html>
